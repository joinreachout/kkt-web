<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HomePro × Kitty Kat Technologies</title>
<link rel="icon" href="kkt-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   One route, four stops. The screen travels left as the conversation moves;
   the rail at the top says where we are and how much is left.

   The register is deliberately flat: figures, nouns, outcomes. Anything that
   reads like a headline from a deck has no place here — the listener is the
   VP who owns Data & AI, and the canvas only has to keep up with George.

   Type carries the design. There is no ornament to look at, so nothing
   competes with what is being said.
--------------------------------------------------------------------------- */
:root{
  --bg:#FFFFFF; --surface:#F6F5F3; --line:rgba(0,0,0,.10); --line-strong:rgba(0,0,0,.22);
  --text:#14110F; --text-2:#5A544E; --text-3:#8C857D;
  --accent:#FF6A00; --accent-text:#C2410C; --accent-dim:rgba(255,106,0,.10);
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --pad:clamp(28px,5vw,88px);
  --rail-h:80px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- rail ---------- */
.rail{
  position:fixed; inset:0 0 auto 0; height:var(--rail-h); z-index:20;
  display:flex; align-items:center; gap:clamp(14px,2.4vw,34px);
  padding:0 var(--pad); background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
}
.marks{display:flex;align-items:center;gap:14px;flex:none}
.marks img.kkt{width:38px;height:38px;display:block}
.marks .x{color:var(--text-3);font-size:14px}
.marks img.partner{height:30px;display:block;border-radius:4px}
.stops{display:flex;align-items:center;gap:0;flex:1;min-width:0}
.stop-btn{
  display:flex;align-items:center;gap:9px;padding:6px 0;flex:1;min-width:0;
  color:var(--text-3);transition:color .25s ease;
}
.stop-btn .dot{
  width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1px solid var(--line-strong);font-family:var(--mono);font-size:10.5px;
  transition:background .3s ease,border-color .3s ease,color .3s ease;
}
.stop-btn .nm{font-size:13px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-btn:hover{color:var(--text-2)}
.stop-btn.done .dot{background:var(--text);border-color:var(--text);color:#fff}
.stop-btn.here{color:var(--text)}
.stop-btn.here .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.stop-btn.here .nm{font-weight:600}
.tools{display:flex;gap:6px;flex:none}
.tools button{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);border:1px solid var(--line);border-radius:100px;padding:6px 12px;
  transition:border-color .2s ease,color .2s ease;
}
.tools button:hover{border-color:var(--line-strong);color:var(--text)}

/* progress hairline under the rail */
.progress{position:fixed;top:var(--rail-h);left:0;height:2px;background:var(--accent);z-index:21;
  transition:width .65s cubic-bezier(.65,0,.15,1)}

/* ---------- the field ----------
   One roadmap, not a deck. Every stop lives on the same horizontal line; the
   camera pans along it, so the previous stop leaves the frame and the next one
   is already visible at the edge. Nothing ever "cuts". Pressing 0 pulls the
   camera back far enough to see the whole route at once.                    */
.road{position:fixed;inset:var(--rail-h) 0 0 0;overflow:hidden}
.field{
  position:relative;height:100%;display:flex;align-items:stretch;
  transform-origin:0 50%;
  transition:transform .78s cubic-bezier(.62,0,.14,1);
  will-change:transform;
}
/* the line the whole conversation runs along */
/* ---------- the route strip ----------
   A road pinned to the foot of the screen. It travels with you: the active
   waypoint always sits under the middle of the copy, the ones behind and
   ahead stay in frame, and a pulse runs down the line on every move — so the
   movement is visible even when the copy has already settled.            */
.route{
  position:fixed;left:0;right:0;bottom:0;height:clamp(74px,11vh,104px);z-index:19;
  overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
}
.route-track{
  position:absolute;top:50%;left:50%;height:0;display:flex;align-items:center;
  transition:transform .78s cubic-bezier(.62,0,.14,1);
}
.route-line{position:absolute;top:0;left:0;height:1px;background:var(--line);transform:translateY(-50%)}
.route-line-done{position:absolute;top:0;left:0;height:2px;background:var(--text);
  transform:translateY(-50%);transition:width .78s cubic-bezier(.62,0,.14,1)}
.route-pulse{position:absolute;top:0;left:0;width:9px;height:9px;border-radius:50%;
  background:var(--accent);transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.route-pulse.go{animation:pulse .78s cubic-bezier(.62,0,.14,1)}
@keyframes pulse{0%{opacity:1}100%{opacity:0}}
.wp{
  position:absolute;top:0;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:11px;padding:0 14px;background:var(--bg);
  pointer-events:auto;cursor:pointer;
}
.wp .pin{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1px solid var(--line-strong);font-family:var(--mono);font-size:11.5px;color:var(--text-3);
  background:var(--bg);transition:background .45s ease,border-color .45s ease,color .45s ease,transform .45s ease}
.wp .wl{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-3);white-space:nowrap;transition:color .45s ease}
.wp.done .pin{background:var(--text);border-color:var(--text);color:#fff}
.wp.here .pin{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.12)}
.wp.here .wl{color:var(--text)}
:root{--spine-y:72%;--stop-w:100vw}

.stop{
  position:relative;width:var(--stop-w);flex:none;
  padding:clamp(26px,4.4vh,52px) var(--pad) 0;
  display:flex;flex-direction:column;
}
/* the copy is centred in the frame — it used to sit against the left edge
   with the rest of the screen empty */
.inner{width:100%;max-width:1180px;margin:0 auto;flex:1;
  display:flex;flex-direction:column;justify-content:center;
  padding-bottom:clamp(80px,14vh,150px)}

/* content dims when the camera has moved on, so the eye stays where we are */
.stop .inner{transition:opacity .6s ease}
.stop:not(.is-here) .inner{opacity:.22}
.field.overview .detail{opacity:0}
.field.overview .waypoint{
  transform:translateY(-50%) scale(var(--wpscale,1));
  transform-origin:left center;
}
.field.overview .waypoint .pin{background:var(--text);border-color:var(--text);color:#fff}
.field.overview .waypoint .wl{color:var(--text)}

/* content enters as the stop arrives */
.stop [data-in]{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.7,.3,1)}
.stop.is-here [data-in],.stop.is-past [data-in]{opacity:1;transform:none}
.stop.is-here [data-in="1"]{transition-delay:.12s}
.stop.is-here [data-in="2"]{transition-delay:.20s}
.stop.is-here [data-in="3"]{transition-delay:.28s}
.stop.is-here [data-in="4"]{transition-delay:.36s}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin:0 0 18px}
h1,h2{font-weight:600;letter-spacing:-.035em;line-height:1.03;margin:0}
h1{font-size:clamp(34px,4.4vw,64px);max-width:19ch}
h2{font-size:clamp(31px,3.9vw,56px);max-width:20ch}
.sub{font-size:clamp(16px,1.4vw,20px);line-height:1.5;color:var(--text-2);margin:18px 0 0;max-width:60ch}

/* ---------- 1 · facts ---------- */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:clamp(26px,3.6vh,48px);border-top:1px solid var(--line)}
.fact{padding:20px 24px 0 0;border-right:1px solid var(--line)}
.fact:last-child{border-right:0;padding-right:0}
.fact .v{font-size:clamp(18px,1.7vw,24px);font-weight:600;letter-spacing:-.025em;line-height:1.15;margin:0}
.fact .n{font-size:13.5px;line-height:1.5;color:var(--text-2);margin:8px 0 0}
.fact .c{font-size:11.5px;line-height:1.45;color:var(--text-3);margin:8px 0 0}
.fact:last-child .v{color:var(--accent-text)}

/* ---------- 2 · assumptions ---------- */
.asm{list-style:none;padding:0;margin:clamp(24px,3.4vh,42px) 0 0;max-width:100ch}
.asm li{display:flex;gap:18px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line)}
.asm li:last-child{border-bottom:1px solid var(--line)}
.asm .i{font-family:var(--mono);font-size:11.5px;color:var(--text-3);flex:none;width:20px}
.asm .t{font-size:clamp(16px,1.5vw,21px);line-height:1.35;letter-spacing:-.015em}
.bridge{margin:clamp(20px,2.8vh,32px) 0 0;padding-left:18px;border-left:2px solid var(--accent);
  font-size:clamp(16px,1.5vw,21px);line-height:1.42;letter-spacing:-.015em;max-width:70ch}

/* ---------- 3 · the four steps ---------- */
.foot{font-size:13.5px;color:var(--text-2);margin:clamp(18px,2.6vh,30px) 0 0}

/* ---------- 4 · role ---------- */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2vw,34px);margin-top:clamp(24px,3.4vh,46px)}
.role{border-top:1px solid var(--line-strong);padding-top:16px}
.role h3{font-size:clamp(16px,1.5vw,21px);font-weight:600;letter-spacing:-.02em;line-height:1.25;margin:0}
.role p{font-size:14px;line-height:1.55;color:var(--text-2);margin:11px 0 0}

/* ---------- 5 · next ---------- */
/* four-up variant of the role grid — screens 1 and 3 carry four blocks */
.roles.four{grid-template-columns:repeat(4,1fr)}

/* the one example we are allowed to quote, set apart from the role copy */
.proof{margin-top:clamp(20px,2.8vh,34px);border:1px solid var(--line-strong);border-radius:16px;
  padding:clamp(18px,2vw,26px) clamp(20px,2.2vw,30px) clamp(16px,1.8vw,22px)}
.proof .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent-text);margin:0 0 10px}
.proof h3{font-size:clamp(15px,1.35vw,19px);font-weight:600;letter-spacing:-.02em;line-height:1.25;margin:0}
.proof .ctx{font-size:13px;line-height:1.45;color:var(--text-2);margin:7px 0 0}
.proof .facts{margin-top:clamp(14px,1.8vh,20px)}
.proof .fact{padding:14px 20px 0 0}
.proof .foot{margin-top:12px;font-size:11.5px;line-height:1.45;color:var(--text-3)}

.closing{margin-top:clamp(16px,2.2vh,26px);display:grid;grid-template-columns:1.05fr .95fr;
  gap:clamp(18px,2.4vw,38px);align-items:start}
.ask-line{margin:0;background:var(--text);color:#fff;border-radius:14px;
  padding:clamp(14px,1.6vw,20px) clamp(16px,1.8vw,24px);
  font-size:clamp(14px,1.2vw,16.5px);line-height:1.45;letter-spacing:-.01em}
.close-line{margin:0;font-size:clamp(13.5px,1.15vw,15.5px);line-height:1.55;color:var(--text-2);
  padding-top:4px}
.closing .beyond{margin-top:13px;padding-top:11px}
.closing .beyond .chips span{font-size:11px;padding:5px 10px}

/* The closing screen carries the most of any: role, example, ask, and the
   short list. Its vertical rhythm is tightened so all of it stays above the
   route strip at 1600×900, which is the screen the meeting runs on. */
[data-stop="fit"] .roles{margin-top:clamp(18px,2.4vh,30px)}
[data-stop="fit"] .proof{margin-top:clamp(13px,1.7vh,20px);
  padding:clamp(15px,1.7vw,20px) clamp(20px,2.2vw,30px) clamp(12px,1.4vw,16px)}
[data-stop="fit"] .proof .facts{margin-top:12px}
[data-stop="fit"] .proof .fact{padding-top:12px}
[data-stop="fit"] .proof .foot{margin-top:8px}
[data-stop="fit"] .closing{margin-top:clamp(11px,1.4vh,16px)}

.beyond{margin-top:clamp(20px,2.8vh,36px);border-top:1px solid var(--line);padding-top:16px}
.beyond .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin:0 0 11px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:13px;color:var(--text-2);border:1px solid var(--line);border-radius:100px;padding:6px 13px}

/* ---------- arrows ---------- */
.nav{position:fixed;bottom:calc(clamp(74px,11vh,104px) + 14px);right:var(--pad);display:flex;gap:8px;z-index:20}
.nav button{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);
  display:grid;place-items:center;font-size:17px;color:var(--text);
  background:rgba(255,255,255,.9);transition:background .2s ease,border-color .2s ease,opacity .2s ease;
}
.nav button:hover{background:var(--text);border-color:var(--text);color:#fff}
.nav button[disabled]{opacity:.25;pointer-events:none}
.hint{position:fixed;bottom:clamp(18px,3vh,34px);left:var(--pad);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);z-index:20}

@media (max-width:1080px){
  .facts,  .fact{border-right:0;padding-right:0}
  .roles,  .stop-btn .nm{display:none}
  .stops{flex:none;gap:10px}
  .stop-btn{flex:none}
}
@media (prefers-reduced-motion:reduce){
  .track,.progress{transition:none}
  .stop [data-in]{opacity:1;transform:none;transition:none}
}

/* Print: the route unrolls into pages, so the deck can be left behind. */
@media print{
  body{overflow:visible}
  .rail,.nav,.hint,.progress{display:none!important}
  .road{position:static;inset:auto;overflow:visible}
  .track{display:block;width:auto;transform:none!important}
  .stop{width:auto;height:auto;page-break-after:always;padding:26px 0}
  .stop [data-in]{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>

<header class="rail">
  <div class="marks">
    <img class="kkt" src="kkt-mark.svg" alt="Kitty Kat Technologies">
    <span class="x">×</span>
    <img class="partner" id="partnerMark" src="" alt="">
  </div>
  <div class="tools" style="margin-left:auto"><button type="button" id="btn-print">Print</button></div>
</header>
<div class="progress" id="progress" style="width:20%"></div>

<main class="road">
  <div class="field" id="field"></div>
</main>

<nav class="route" id="route" aria-label="Conversation route">
  <div class="route-track" id="routeTrack">
    <span class="route-line" id="routeLine"></span>
    <span class="route-line-done" id="routeDone"></span>
    <span class="route-pulse" id="routePulse"></span>
  </div>
</nav>

<div class="nav">
  <button type="button" id="prev" aria-label="Previous">‹</button>
  <button type="button" id="next" aria-label="Next">›</button>
</div>

<!-- ⛔ The host serves content.js as immutable for a year, so a browser that
     has fetched one ?v= will never look again. Bump this token on EVERY change
     to content.js — otherwise the page keeps showing the previous text. -->
<script src="content.js?v=2026-08-25-1"></script>
<script>
(function () {
  var C = window.CANVAS;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); };
  var field = document.getElementById('field');
    var progress = document.getElementById('progress');

  /* the partner mark and the page title come from `client`, so a new company
     needs no edit in this file at all */
  var mark = document.getElementById('partnerMark');
  mark.src = C.client.logo;
  mark.alt = C.client.name;
  document.title = C.client.name + ' × Kitty Kat Technologies';

  /* ---- the four stops, built in the order the conversation takes them ---- */
  var html = '';

  var quad = function (arr) {
    return '<div class="roles four">' + arr.map(function (r) {
      return '<div class="role"><h3>' + esc(r.title) + '</h3><p>' + esc(r.body) + '</p></div>';
    }).join('') + '</div>';
  };

  html += '<section class="stop" data-stop="kkt"><div class="inner detail">' +
    '<p class="eyebrow" data-in="1">' + esc(C.kkt.eyebrow) + '</p>' +
    '<h1 data-in="2">' + esc(C.kkt.headline) + '</h1>' +
    '<p class="sub" data-in="3">' + esc(C.kkt.sub) + '</p>' +
    '<div data-in="4">' + quad(C.kkt.method) + '</div>' +
  '</div></section>';

  html += '<section class="stop" data-stop="understand"><div class="inner detail">' +
    '<p class="eyebrow" data-in="1">' + esc(C.understand.eyebrow) + '</p>' +
    '<h2 data-in="2">' + esc(C.understand.headline) + '</h2>' +
    '<ul class="asm" data-in="3">' + C.understand.items.map(function (t, i) {
      return '<li><span class="i">' + ('0' + (i + 1)) + '</span><span class="t">' + esc(t) + '</span></li>';
    }).join('') + '</ul>' +
    '<p class="bridge" data-in="4">' + esc(C.understand.open) + '</p>' +
  '</div></section>';

  html += '<section class="stop" data-stop="growth"><div class="inner detail">' +
    '<p class="eyebrow" data-in="1">' + esc(C.growth.eyebrow) + '</p>' +
    '<h2 data-in="2">' + esc(C.growth.headline) + '</h2>' +
    '<div data-in="3">' + quad(C.growth.steps) + '</div>' +
    '<p class="bridge" data-in="4">' + esc(C.growth.note) + '</p>' +
  '</div></section>';

  /* The closing screen carries three things — our role, the one example we
     are allowed to quote, and the ask. The example sits in its own band so
     the numbers do not read as part of the role copy. */
  var F = C.fit;
  html += '<section class="stop" data-stop="fit"><div class="inner detail">' +
    '<p class="eyebrow" data-in="1">' + esc(F.eyebrow) + '</p>' +
    '<h2 data-in="2">' + esc(F.headline) + '</h2>' +
    '<div data-in="3"><div class="roles">' + F.items.map(function (r) {
      return '<div class="role"><h3>' + esc(r.title) + '</h3><p>' + esc(r.body) + '</p></div>';
    }).join('') + '</div></div>' +
    '<div class="proof" data-in="4">' +
      '<p class="lbl">' + esc(F.proof.label) + '</p>' +
      '<h3>' + esc(F.proof.headline) + '</h3>' +
      '<p class="ctx">' + esc(F.proof.context) + '</p>' +
      '<div class="facts">' + F.proof.facts.map(function (f) {
        return '<div class="fact"><p class="v">' + esc(f.value) + '</p><p class="n">' + esc(f.note) + '</p></div>';
      }).join('') + '</div>' +
      '<p class="foot">' + esc(F.proof.caveat) + '</p>' +
    '</div>' +
    /* the ask on the left, and on the right the answer to "why you" followed
       by the short list of everything else — it rides in this column because
       a band of its own pushes the screen past the fold */
    '<div class="closing" data-in="4">' +
      '<p class="ask-line">' + esc(F.next) + '</p>' +
      '<div>' +
        '<p class="close-line">' + esc(F.close) + '</p>' +
        '<div class="beyond"><p class="lbl">' + esc(F.beyondLabel) + '</p>' +
          '<div class="chips">' + F.beyond.map(function (b) { return '<span>' + esc(b) + '</span>'; }).join('') + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div></section>';

  field.insertAdjacentHTML('beforeend', html);

  /* ---- the route strip ----
     Waypoints are laid out at a fixed spacing and the whole strip is moved so
     the current one sits in the middle of the screen. Neighbours stay in
     frame, which is what makes it read as a road rather than a page count. */
  var routeTrack = document.getElementById('routeTrack');
  var GAP = 320;
  routeTrack.insertAdjacentHTML('beforeend', C.stops.map(function (st, i) {
    return '<button type="button" class="wp" data-go="' + i + '" style="left:' + (i * GAP) + 'px">' +
      '<span class="pin">' + (i + 1) + '</span><span class="wl">' + esc(st.label) + '</span></button>';
  }).join(''));
  var line = document.getElementById('routeLine');
  var done = document.getElementById('routeDone');
  var pulse = document.getElementById('routePulse');
  line.style.width = ((C.stops.length - 1) * GAP) + 'px';

  var sections = Array.prototype.slice.call(field.querySelectorAll('.stop'));
  var wps = Array.prototype.slice.call(routeTrack.querySelectorAll('.wp'));
  var at = 0;

  function go(n) {
    var from = at;
    at = Math.max(0, Math.min(C.stops.length - 1, n));
    field.style.transform = 'translateX(-' + (at * 100) + 'vw)';
    routeTrack.style.transform = 'translateX(-' + (at * GAP) + 'px)';
    done.style.width = (at * GAP) + 'px';

    sections.forEach(function (s, i) {
      s.classList.toggle('is-here', i === at);
      s.classList.toggle('is-past', i < at);
    });
    wps.forEach(function (w, i) {
      w.classList.toggle('here', i === at);
      w.classList.toggle('done', i < at);
      w.setAttribute('aria-current', String(i === at));
    });

    if (from !== at) {
      pulse.style.left = (from * GAP) + 'px';
      pulse.classList.remove('go');
      void pulse.offsetWidth;                      // restart the animation
      pulse.style.transition = 'none';
      requestAnimationFrame(function () {
        pulse.style.transition = 'left .78s cubic-bezier(.62,0,.14,1)';
        pulse.style.left = (at * GAP) + 'px';
        pulse.classList.add('go');
      });
    }

    progress.style.width = ((at + 1) / C.stops.length * 100) + '%';
    document.getElementById('prev').disabled = at === 0;
    document.getElementById('next').disabled = at === C.stops.length - 1;
  }

  routeTrack.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]'); if (b) go(Number(b.dataset.go));
  });
  document.getElementById('prev').addEventListener('click', function () { go(at - 1); });
  document.getElementById('next').addEventListener('click', function () { go(at + 1); });
  document.getElementById('btn-print').addEventListener('click', function () { window.print(); });
  window.addEventListener('resize', function () { go(at); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(at + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(at - 1); }
    else if (e.key === 'Home') { go(0); }
    else if (e.key === 'End') { go(C.stops.length - 1); }
    else { var n = parseInt(e.key, 10); if (n >= 1 && n <= C.stops.length) go(n - 1); }
  });

  go(0);
})();
</script>
</body>
</html>
